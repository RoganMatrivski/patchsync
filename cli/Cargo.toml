[package]
name = "patchsync-cli"
version = "0.1.0"
authors = ["Robin Mauritz <robinmauritzrm@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RoganMatrivski/patchsync"
description = "CLI for patchsync, an rsync-like file syncing tool over iroh."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

[dependencies]
patchsync.workspace = true

# Shared
flume.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "fs"] }
tracing.workspace = true

# CLI only
clap.workspace = true
color-eyre.workspace = true
eyre.workspace = true
indicatif.workspace = true
iroh-tickets.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true
