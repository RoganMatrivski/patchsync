[workspace]
members = [
    ".",
    "cli",
]

[workspace.dependencies]
bidiff = "1.0.0"
blake3 = "1.8.6"
clap = { version = "4.5", features = ["derive"] }
color-eyre = { version = "0.6", features = ["capture-spantrace"] }
eyre = "0.6.12"
flume = "0.12.0"
ignore = "0.4.31"
iroh = "1.0.3"
mimalloc = "0.1.48"
postcard = "1.1.3"
qbsdiff = "1.4.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
patchsync = { path = "." }

[package]
name = "patchsync"
version = "0.1.0"
edition = "2024"

[dependencies]
bidiff.workspace = true
blake3.workspace = true
eyre.workspace = true
flume.workspace = true
ignore.workspace = true
iroh.workspace = true
postcard.workspace = true
qbsdiff.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true

[profile.dev.package.backtrace]
opt-level = 3
