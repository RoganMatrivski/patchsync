[workspace]
members = [
    ".",
    "cli",
]

[workspace.dependencies]
# Shared dependencies
flume = "0.12.0"
iroh = "1.0.3"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"

# Library dependencies
blake3 = "1.8.6"
fastcdc = "4.0.1"
ignore = "0.4.31"
memmap2 = "0.9.11"
postcard = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
color-eyre = { version = "0.6", features = ["capture-spantrace"] }
eyre = "0.6.12"
indicatif = "0.18.6"
iroh-tickets = "1.0.0"
mimalloc = "0.1.48"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Internal path dependencies
patchsync = { path = "." }

[package]
name = "patchsync"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RoganMatrivski/patchsync"
authors = ["Robin Mauritz <robinmauritzrm@gmail.com>"]
description = "Sync a directory (or a file), rsync-like, with iroh."

[dependencies]
# Shared
flume.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["io-util", "rt"] }
tracing.workspace = true

# Library only
blake3.workspace = true
fastcdc.workspace = true
ignore.workspace = true
memmap2.workspace = true
postcard.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[profile.dev.package.backtrace]
opt-level = 3

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# Publish jobs to run in CI
pr-run-mode = "plan"
