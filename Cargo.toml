[workspace]
members = [
    ".",
    "cli",
]

[workspace.dependencies]
# Shared dependencies
flume = "0.12.0"
iroh = "1.0.3"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"

# Library dependencies
blake3 = "1.8.6"
fastcdc = "4.0.1"
ignore = "0.4.31"
memmap2 = "0.9.11"
postcard = "1.1.3"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
color-eyre = { version = "0.6", features = ["capture-spantrace"] }
eyre = "0.6.12"
indicatif = "0.18.6"
iroh-tickets = "1.0.0"
mimalloc = "0.1.48"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Internal path dependencies
patchsync = { path = "." }

[package]
name = "patchsync"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RoganMatrivski/patchsync"
authors = ["Robin Mauritz <robinmauritzrm@gmail.com>"]

[dependencies]
# Shared
flume.workspace = true
iroh.workspace = true
tokio = { workspace = true, features = ["io-util", "rt"] }
tracing.workspace = true

# Library only
blake3.workspace = true
fastcdc.workspace = true
ignore.workspace = true
memmap2.workspace = true
postcard.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[profile.dev.package.backtrace]
opt-level = 3
